services:
  db:
    image: postgres:17-bookworm
    container_name: lae-secret-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lae_chat
      POSTGRES_USER: lae_chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lae-secret-chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lae_chat -d lae_chat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lae-chat-network

  api:
    image: ghcr.io/almirahmicic28-byte/lae-secret-chat-backend:latest
    container_name: lae-secret-chat-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://lae_chat:${POSTGRES_PASSWORD}@db:5432/lae_chat
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: lae-secret-chat
      JWT_AUDIENCE: lae-android
      ACCESS_TOKEN_TTL_SECONDS: 86400
      TRUST_PROXY: "true"

      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8081
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}

      PORTAL_HOST: 0.0.0.0
      PORTAL_PORT: 8082
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${API_PORT:-18080}:8080"
      - "${ADMIN_PUBLIC_PORT:-18081}:8081"
      - "${PORTAL_PUBLIC_PORT:-18082}:8082"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lae-chat-network

volumes:
  lae-secret-chat-postgres:
    name: lae-secret-chat-postgres

networks:
  lae-chat-network:
    name: lae-secret-chat-network
    driver: bridge
